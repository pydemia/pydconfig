name: Upstream compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-and-manifest:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14.7"]
        include:
          - os: macos-latest
            python: "3.14.7"
          - os: windows-latest
            python: "3.14.7"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/compatibility.txt
      - name: Install the compatibility baseline
        run: python -m pip install -r requirements/compatibility.txt
      - name: Check upstream APIs and Kubernetes 1.37.1 schema
        run: python scripts/check_compatibility.py --kubernetes-version 1.37.1
