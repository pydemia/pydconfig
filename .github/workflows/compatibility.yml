name: Package compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14.7"]
        include:
          - os: macos-latest
            python: "3.14.7"
          - os: windows-latest
            python: "3.14.7"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/compatibility.txt
            pyproject.toml
      - name: Install the compatibility baseline
        run: python -m pip install -r requirements/compatibility.txt build
      - name: Build wheel from sdist
        run: python -m build
      - name: Install the built package and verification tools
        run: python -m pip install "dist/pydconfig-1.0.0-py3-none-any.whl[dev]"
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Check dependencies
        run: python -m pip check
      - name: Check upstream settings APIs
        run: python scripts/check_compatibility.py
      - name: Run contracts against the installed wheel
        timeout-minutes: 3
        run: python -m pytest -v -o faulthandler_timeout=30
      - name: Check installed package and file example
        run: python scripts/check_distribution.py
      - name: Type check public implementation
        run: python -m mypy
      - name: Check formatting and imports
        run: python -m ruff check src tests scripts examples/basic/app.py
