[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "pydconfig"
version = "1.0.1"
description = "Named, typed application configuration from YAML, dotenv and environment variables"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15,<3",
  "python-dotenv>=1.2.3,<2",
  "PyYAML>=6.0.3,<7",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/pydemia/pydconfig"
Documentation = "https://github.com/pydemia/pydconfig/tree/main/docs"
Issues = "https://github.com/pydemia/pydconfig/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "mypy>=1.15,<2", "types-PyYAML", "ruff", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydconfig"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples/basic", "scripts", "requirements", "README.md", "pyproject.toml", ".worknotes", ".github", ".python-version"]
exclude = ["**/__pycache__", "**/.env", "**/.env.local", "**/.env.test", "**/.env.stg", "**/.env.prd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["src/pydconfig"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
