apiVersion: v1
kind: Namespace
metadata:
  name: pydconfig-compat
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pydconfig-example
  namespace: pydconfig-compat
data:
  PYDCONFIG_PROFILE: "prd"
  PYDCONFIG_FEATURE__ENABLED: "TRUE"
  PYDCONFIG_DATABASE__POOL__SIZE: "20"
  PYDCONFIG_APP__HOSTS: '["primary", "replica"]'
  PYDCONFIG_APP__LITERAL: '${UNEXPANDED}'
---
apiVersion: v1
kind: Secret
metadata:
  name: pydconfig-example
  namespace: pydconfig-compat
type: Opaque
stringData:
  PYDCONFIG_DATABASE__PASSWORD: "example-only"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pydconfig-env-injection
  namespace: pydconfig-compat
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: check
          image: python:3.14.7-slim
          command: ["python", "-c"]
          args:
            - |
              import json
              import os
              import sys

              assert sys.version_info[:3] == (3, 14, 7)
              assert os.environ["PYDCONFIG_PROFILE"] == "prd"
              assert os.environ["PYDCONFIG_FEATURE__ENABLED"] == '"False"'
              assert os.environ["PYDCONFIG_DATABASE__POOL__SIZE"] == "20"
              assert json.loads(os.environ["PYDCONFIG_APP__HOSTS"]) == ["primary", "replica"]
              assert os.environ["PYDCONFIG_APP__LITERAL"] == "${UNEXPANDED}"
              assert os.environ["PYDCONFIG_DATABASE__PASSWORD"] == "example-only"
              print("Python 3.14.7: Kubernetes environment injection passed")
          envFrom:
            - configMapRef:
                name: pydconfig-example
            - secretRef:
                name: pydconfig-example
          env:
            - name: PYDCONFIG_FEATURE__ENABLED
              value: '"False"'
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
